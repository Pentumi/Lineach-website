[build]
  publish = "."
  # No build command needed - pure static HTML

[build.environment]
  # Optional: NODE_VERSION if you add any JS build later

# No catch-all redirect needed for this multi-page static site.
# Netlify automatically serves index.html for directories (e.g. /about/ -> /about/index.html).
# Add specific redirects here only if needed (e.g. old URLs).

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Form handling note:
# The cleaning sub-site uses Netlify forms (data-netlify="true").
# Main site forms currently point to Formspree (update the action URL with your real form ID).

# Custom domain will be configured in the Netlify dashboard after first deploy.
# Recommended: Add lineach.com and www.lineach.com in Netlify > Domain settings.